name: Keep a GitHub snapshot of My Top 10

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: list-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Refresh public list snapshot
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = fs.readFileSync('config.js', 'utf8');
          const url = config.match(/supabaseUrl:\s*['"]([^'"]+)/)?.[1];
          const key = config.match(/supabasePublishableKey:\s*['"]([^'"]+)/)?.[1];
          if (!url || !key) throw new Error('Supabase public config not found');
          const endpoint = new URL('/rest/v1/top10_items', url);
          endpoint.search = new URLSearchParams({select: '*', order: 'kind.asc,position.asc'});
          (async () => {
            const response = await fetch(endpoint, {headers: {apikey: key, Accept: 'application/json'}});
            if (!response.ok) throw new Error('Supabase snapshot failed (' + response.status + '): ' + await response.text());
            const items = await response.json();
            if (!Array.isArray(items)) throw new Error('Supabase returned invalid list data');
            if (!items.length) throw new Error('Supabase returned an empty list; refusing to replace a saved backup.');
            let previous = {items: []};
            try { previous = JSON.parse(fs.readFileSync('backup.json', 'utf8')); } catch {}
            if (JSON.stringify(items) === JSON.stringify(previous.items)) {
              console.log('List is unchanged; keeping the previous snapshot date.');
              return;
            }
            fs.writeFileSync('backup.json', JSON.stringify({updatedAt: new Date().toISOString(), items}, null, 2) + '\n');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Commit changed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backup.json
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit.'
          else
            git commit -m 'Refresh public list backup'
            git push
          fi
