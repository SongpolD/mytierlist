<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Top 10</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap');
:root{--bg:#0c0d12;--panel:#151720;--line:#292d3a;--muted:#969bac;--text:#f6f6fa;--pink:#ff4966;--purple:#8c6cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -15%,#292047 0,transparent 38%),var(--bg);color:var(--text);font-family:'DM Sans','Noto Sans Thai',sans-serif;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:36px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-weight:800;font-size:19px;letter-spacing:-.6px}.brand b{color:var(--pink)}.badge{border:1px solid var(--line);border-radius:99px;padding:8px 13px;color:#c8cad5;font-size:13px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:35px 38px;background:linear-gradient(110deg,#191a24 0%,#191a24f2 53%,#251c3b 100%);margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:1.8px;color:var(--pink);font-weight:800}.hero h1{font-size:clamp(36px,7vw,62px);letter-spacing:-2px;line-height:1;margin:12px 0}.hero p{color:#aeb0be;margin:0 0 25px}.stats{display:flex;gap:22px;color:#aeb0be;font-size:13px}.stats strong{color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:27px 0 14px}.toolbar h2{font-size:20px;margin:0}.filters{display:flex;gap:7px;flex-wrap:wrap}.button,.filter{border:1px solid var(--line);background:var(--panel);color:#d7d8e1;padding:9px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}.filter.active{background:#322347;border-color:#674991;color:#e8d8ff}.button.primary{border-color:transparent;background:var(--pink);color:white;font-weight:700}.button:hover,.filter:hover{filter:brightness(1.16)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.poster{height:235px;background:#222431;position:relative;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.placeholder{height:100%;display:grid;place-items:center;font-size:42px;color:#707386;background:linear-gradient(135deg,#272938,#171821)}.rank{position:absolute;top:10px;left:10px;background:#0c0d12dc;border:1px solid #ffffff24;color:#fff;border-radius:8px;padding:5px 9px;font-weight:800;font-size:13px}.card-body{padding:12px 12px 14px}.title{font-size:14px;font-weight:700;line-height:1.35;min-height:38px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.card-actions{display:flex;gap:5px;margin-top:10px}.small{padding:5px 8px;font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:55px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.admin{display:none;background:#171923;border:1px solid #383b4b;border-radius:14px;padding:17px;margin:14px 0}.admin.show{display:block}.admin h3{font-size:15px;margin:0 0 12px}.form{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:8px}.form input,.form select,.login input{min-width:0;background:#0f1017;border:1px solid #343746;color:#fff;padding:10px 11px;border-radius:9px;font:inherit}.login{display:none;position:fixed;inset:0;background:#05050add;align-items:center;justify-content:center;padding:16px;z-index:5}.login.show{display:flex}.loginbox{width:min(410px,100%);background:#171923;border:1px solid #383b4b;border-radius:18px;padding:23px}.loginbox h3{margin:0 0 8px}.loginbox p{color:var(--muted);font-size:13px}.loginbox input{width:100%;margin:8px 0}.login-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#282b37;padding:11px 16px;border-radius:10px;display:none;z-index:9;font-size:13px}.toast.show{display:block}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}.poster{height:220px}}@media(max-width:620px){.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/-1}.form input:nth-child(3){grid-column:1/-1}.wrap{padding:20px 14px 50px}.hero{padding:27px 22px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.poster{height:220px}.toolbar{align-items:flex-start;flex-direction:column}.stats{gap:12px;flex-wrap:wrap}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div class="brand">my<span style="color:var(--pink)">top</span><b>10</b></div><div style="display:flex;gap:8px;align-items:center"><span class="badge" id="status">Public list</span><button class="button" id="loginBtn">เจ้าของรายการ</button></div></header>
<section class="hero"><div class="eyebrow">YOUR PERSONAL RANKING</div><h1>My Top 10</h1><p>เรื่องโปรดของฉัน เรียงอันดับตามใจ</p><div class="stats"><span><strong id="count">0</strong> เรื่อง</span><span>·</span><span>ทุกคนดูได้</span></div></section>
<div class="toolbar"><h2>รายการจัดอันดับ</h2><div class="filters"><button class="filter active" data-filter="ทั้งหมด">ทั้งหมด</button><button class="filter" data-filter="หนัง">หนัง</button><button class="filter" data-filter="ซีรีส์">ซีรีส์</button><button class="filter" data-filter="อนิเมะ">อนิเมะ</button></div></div>
<section class="admin" id="admin"><h3>จัดการลิสต์ · เฉพาะเจ้าของ</h3><form class="form" id="addForm"><input id="name" placeholder="ชื่อเรื่อง" required><select id="kind"><option>อนิเมะ</option><option>หนัง</option><option>ซีรีส์</option></select><input id="image" placeholder="ลิงก์โปสเตอร์ (ไม่ใส่ก็ได้)"><button class="button primary" type="submit">＋ เพิ่ม</button></form></section>
<section class="grid" id="grid"><div class="empty">กำลังโหลดรายการ…</div></section></main>
<div class="login" id="login"><div class="loginbox"><h3>เข้าสู่ระบบเจ้าของ</h3><p>เราจะส่งลิงก์เข้าสู่ระบบไปยังอีเมลที่ได้รับอนุญาต</p><input type="email" id="email" placeholder="อีเมลเจ้าของ" autocomplete="email"><div class="login-actions"><button class="button" id="closeLogin">ยกเลิก</button><button class="button primary" id="sendLink">ส่งลิงก์เข้าสู่ระบบ</button></div></div></div><div class="toast" id="toast"></div>
<script src="./config.js"></script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.MYTOP10_CONFIG||{},ready=cfg.supabaseUrl&&cfg.supabasePublishableKey&&!cfg.supabaseUrl.includes('YOUR_PROJECT')&&!/REPLACE_ME|PASTE_/.test(cfg.supabasePublishableKey);
const supabase=ready?createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
const grid=document.getElementById('grid'),admin=document.getElementById('admin');let items=[],filter='ทั้งหมด',isOwner=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function render(){document.getElementById('count').textContent=items.length;let shown=items.map((x,i)=>({...x,index:i})).filter(x=>filter==='ทั้งหมด'||x.kind===filter);grid.innerHTML=shown.length?'':'<div class="empty">ยังไม่มีรายการในหมวดนี้</div>';shown.forEach(x=>{let c=document.createElement('article');c.className='card';c.innerHTML=`<div class="poster">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.name)}" onerror="this.outerHTML='<div class=placeholder>✧</div>'">`:'<div class="placeholder">✧</div>'}<div class="rank">#${x.index+1}</div></div><div class="card-body"><div class="title">${esc(x.name)}</div><div class="meta">${esc(x.kind)}</div>${isOwner?`<div class="card-actions"><button class="button small" data-a="up">↑</button><button class="button small" data-a="down">↓</button><button class="button small" data-a="image">รูป</button><button class="button small" data-a="delete">ลบ</button></div>`:''}</div>`;if(isOwner)c.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,x));grid.appendChild(c)})}
async function checkOwner(user){if(!supabase||!user)return false;const {data,error}=await supabase.rpc('is_app_owner');return !error&&data===true}
async function load(){if(!supabase){grid.innerHTML='<div class="empty">ยังไม่ได้ตั้งค่าฐานข้อมูลออนไลน์</div>';return}const {data,error}=await supabase.from('top10_items').select('*').order('position');if(error){grid.innerHTML='<div class="empty">โหลดรายการไม่สำเร็จ กรุณาตรวจการตั้งค่าฐานข้อมูล</div>';return}items=data||[];render()}
async function act(action,x){const i=items.findIndex(v=>v.id===x.id);if(action==='delete'){if(!confirm('ลบ '+x.name+' ออกจากลิสต์?'))return;const {error}=await supabase.from('top10_items').delete().eq('id',x.id);if(error)return toast('ลบไม่สำเร็จ ตรวจสิทธิ์อีกครั้ง')}else if(action==='image'){const image=prompt('วางลิงก์โปสเตอร์',x.image||'');if(image===null)return;const {error}=await supabase.from('top10_items').update({image:image.trim()}).eq('id',x.id);if(error)return toast('แก้รูปไม่สำเร็จ')}else{const j=action==='up'?i-1:i+1;if(j<0||j>=items.length)return;const reordered=[...items];[reordered[i],reordered[j]]=[reordered[j],reordered[i]];for(let p=0;p<reordered.length;p++){const {error}=await supabase.from('top10_items').update({position:p+1}).eq('id',reordered[p].id);if(error)return toast('จัดอันดับไม่สำเร็จ')} }await load()}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});
document.getElementById('loginBtn').onclick=()=>{if(isOwner){supabase.auth.signOut();return}document.getElementById('login').classList.add('show')};document.getElementById('closeLogin').onclick=()=>document.getElementById('login').classList.remove('show');
document.getElementById('sendLink').onclick=async()=>{if(!supabase)return toast('ยังไม่ได้ตั้งค่าระบบล็อกอิน');const email=document.getElementById('email').value.trim();if(!email)return toast('กรุณากรอกอีเมล');const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});if(error)return toast(error.message);toast('ส่งลิงก์เข้าสู่ระบบแล้ว กรุณาเช็กอีเมล');document.getElementById('login').classList.remove('show')};
document.getElementById('addForm').onsubmit=async e=>{e.preventDefault();if(!isOwner)return;const name=document.getElementById('name').value.trim();if(items.length>=10)return toast('ลิสต์ครบ 10 เรื่องแล้ว');const {error}=await supabase.from('top10_items').insert({name,kind:document.getElementById('kind').value,image:document.getElementById('image').value.trim(),position:items.length+1});if(error)return toast('เพิ่มไม่สำเร็จ ตรวจสิทธิ์ฐานข้อมูล');e.target.reset();await load()};
if(supabase){supabase.auth.onAuthStateChange(async(_event,session)=>{isOwner=await checkOwner(session?.user);document.getElementById('status').textContent=isOwner?'เจ้าของเข้าสู่ระบบแล้ว':'Public list';document.getElementById('loginBtn').textContent=session?.user?'ออกจากระบบ':'เจ้าของรายการ';admin.classList.toggle('show',isOwner);render()})}
load();
</script></body></html>
