<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Top 10</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap');
:root{--bg:#0c0d12;--panel:#151720;--line:#292d3a;--muted:#969bac;--text:#f6f6fa;--pink:#ff4966;--purple:#8c6cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -15%,#292047 0,transparent 38%),var(--bg);color:var(--text);font-family:'DM Sans','Noto Sans Thai',sans-serif;min-height:100vh}.wrap{max-width:1150px;margin:auto;padding:30px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.brand{font-weight:800;font-size:20px}.brand b{color:var(--pink)}.badge{border:1px solid var(--line);border-radius:99px;padding:8px 13px;color:#c8cad5;font-size:13px}.button,.filter{border:1px solid var(--line);background:var(--panel);color:#d7d8e1;padding:9px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}.primary{border-color:transparent;background:var(--pink);color:#fff}.hero{border:1px solid var(--line);border-radius:20px;padding:34px;background:linear-gradient(110deg,#191a24,#251c3b);margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:1.8px;color:var(--pink);font-weight:800}.hero h1{font-size:clamp(38px,7vw,62px);margin:12px 0}.hero p,.muted{color:#aeb0be}.stats{display:flex;gap:9px;font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 14px}.toolbar h2{font-size:20px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter.active{background:#322347;border-color:#674991;color:#e8d8ff}.admin{display:none;background:#171923;border:1px solid #383b4b;border-radius:14px;padding:17px;margin:14px 0}.admin.show{display:block}.form{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:8px}.form input,.form select,.login input{min-width:0;background:#0f1017;border:1px solid #343746;color:#fff;padding:10px;border-radius:9px;font:inherit}.category{margin:20px 0}.category h3{font-size:16px;color:#ddd6f2}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.card[draggable=true]{cursor:grab}.card.dragging{opacity:.4}.card.over{outline:2px dashed var(--purple)}.poster{height:230px;background:#222431;position:relative}.poster img{width:100%;height:100%;object-fit:cover}.placeholder{height:100%;display:grid;place-items:center;font-size:40px;color:#707386}.rank{position:absolute;top:10px;left:10px;background:#0c0d12dd;border-radius:8px;padding:5px 9px;font-weight:800}.body{padding:12px}.title{font-size:14px;font-weight:700;min-height:38px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:5px;margin-top:10px}.small{padding:5px 8px;font-size:12px}.empty{padding:45px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.login{display:none;position:fixed;inset:0;background:#05050add;align-items:center;justify-content:center;padding:16px}.login.show{display:flex}.loginbox{width:min(410px,100%);background:#171923;border:1px solid #383b4b;border-radius:18px;padding:23px}.loginbox input{width:100%;margin:8px 0}.loginbox p{color:var(--muted);font-size:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#282b37;padding:11px 16px;border-radius:10px;display:none}.toast.show{display:block}@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.wrap{padding:20px 12px}.hero{padding:25px 20px}.toolbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.poster{height:210px}.form{grid-template-columns:1fr 1fr}.form input:first-child,.form input:nth-child(3){grid-column:1/-1}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">my<span style="color:var(--pink)">top</span><b>10</b></div><div style="display:flex;gap:8px;align-items:center"><span class="badge" id="status">Public list</span><button class="button" id="loginBtn">เจ้าของรายการ</button></div></header><section class="hero"><div class="eyebrow">YOUR PERSONAL RANKING</div><h1>My Top 10</h1><p>เรื่องโปรดของฉัน เรียงอันดับตามใจ</p><div class="stats"><strong id="count">0</strong> เรื่อง · ทุกคนดูได้</div></section><div class="toolbar"><h2>รายการจัดอันดับ</h2><div class="filters"><button class="filter active" data-filter="ทั้งหมด">ทั้งหมด</button><button class="filter" data-filter="หนัง">หนัง</button><button class="filter" data-filter="ซีรีส์">ซีรีส์</button><button class="filter" data-filter="อนิเมะ">อนิเมะ</button></div></div><section class="admin" id="admin"><h3>จัดการลิสต์ · เฉพาะเจ้าของ</h3><form class="form" id="addForm"><input id="name" placeholder="ชื่อเรื่อง" required><select id="kind"><option>อนิเมะ</option><option>หนัง</option><option>ซีรีส์</option></select><input id="image" placeholder="ลิงก์โปสเตอร์ (ไม่ใส่ก็ได้)"><button class="button primary">＋ เพิ่ม</button></form></section><section id="grid"></section></main><div class="login" id="login"><div class="loginbox"><h3>เข้าสู่ระบบเจ้าของ</h3><p>เราจะส่งลิงก์เข้าสู่ระบบไปยังอีเมลที่ได้รับอนุญาต</p><input type="email" id="email" placeholder="อีเมลเจ้าของ"><div style="text-align:right"><button class="button" id="closeLogin">ยกเลิก</button> <button class="button primary" id="sendLink">ส่งลิงก์เข้าสู่ระบบ</button></div></div></div><div class="toast" id="toast"></div><script src="./config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.MYTOP10_CONFIG||{},ready=cfg.supabaseUrl&&cfg.supabasePublishableKey,supabase=ready?createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;const kinds=['หนัง','ซีรีส์','อนิเมะ'];let items=[],filter='ทั้งหมด',isOwner=false,dragged=null;const grid=document.getElementById('grid'),admin=document.getElementById('admin');
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function ranked(k){return items.filter(x=>x.kind===k).sort((a,b)=>a.position-b.position)}
function render(){document.getElementById('count').textContent=items.length;grid.innerHTML='';let groups=filter==='ทั้งหมด'?kinds:[filter],found=0;groups.forEach(k=>{let list=ranked(k);if(!list.length)return;found++;let sec=document.createElement('section');sec.className='category';if(filter==='ทั้งหมด'){let h=document.createElement('h3');h.textContent=k+' · '+list.length+' เรื่อง';sec.appendChild(h)}let row=document.createElement('div');row.className='grid';list.forEach((x,i)=>{let c=document.createElement('article');c.className='card';c.draggable=isOwner;c.innerHTML='<div class="poster"><div class="placeholder">✧</div><div class="rank">#'+(i+1)+'</div></div><div class="body"><div class="title"></div><div class="meta"></div>'+ (isOwner?'<div class="actions"><button class="button small" data-a="up">↑</button><button class="button small" data-a="down">↓</button><button class="button small" data-a="image">รูป</button><button class="button small" data-a="delete">ลบ</button></div>':'')+'</div>';c.querySelector('.title').textContent=x.name;c.querySelector('.meta').textContent=x.kind;if(x.image){let im=new Image();im.src=x.image;im.alt=x.name;im.onerror=()=>im.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'✧'}));c.querySelector('.poster').prepend(im)}if(isOwner){c.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,x));c.ondragstart=e=>{dragged=x.id;c.classList.add('dragging');e.dataTransfer.setData('text/plain',x.id)};c.ondragend=()=>{dragged=null;c.classList.remove('dragging');row.querySelectorAll('.over').forEach(a=>a.classList.remove('over'))};c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=async e=>{e.preventDefault();let id=e.dataTransfer.getData('text/plain')||dragged,order=ranked(k).map(a=>a.id),from=order.indexOf(id),to=order.indexOf(x.id);c.classList.remove('over');if(from<0||to<0||from===to)return;order.splice(to,0,order.splice(from,1)[0]);await saveOrder(order)}}row.appendChild(c)});sec.appendChild(row);grid.appendChild(sec)});if(!found)grid.innerHTML='<div class="empty">ยังไม่มีรายการในหมวดนี้</div>'}
async function saveOrder(ids){let r=await Promise.all(ids.map((id,i)=>supabase.from('top10_items').update({position:i+1}).eq('id',id)));if(r.some(x=>x.error))return toast('บันทึกอันดับไม่สำเร็จ');await load();toast('บันทึกอันดับแล้ว')}async function load(){if(!supabase){grid.innerHTML='<div class="empty">ยังไม่ได้ตั้งค่าฐานข้อมูล</div>';return}let {data,error}=await supabase.from('top10_items').select('*');if(error){grid.innerHTML='<div class="empty">โหลดรายการไม่สำเร็จ</div>';return}items=data||[];render()}async function act(a,x){let list=ranked(x.kind),i=list.findIndex(v=>v.id===x.id);if(a==='delete'){if(!confirm('ลบ '+x.name+' ออกจากลิสต์?'))return;let {error}=await supabase.from('top10_items').delete().eq('id',x.id);if(error)return toast('ลบไม่สำเร็จ')}else if(a==='image'){let image=prompt('วางลิงก์โปสเตอร์',x.image||'');if(image===null)return;let {error}=await supabase.from('top10_items').update({image:image.trim()}).eq('id',x.id);if(error)return toast('แก้รูปไม่สำเร็จ')}else{let j=a==='up'?i-1:i+1;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];await saveOrder(list.map(v=>v.id));return}await load()}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('loginBtn').onclick=()=>{if(isOwner){supabase.auth.signOut();return}document.getElementById('login').classList.add('show')};document.getElementById('closeLogin').onclick=()=>document.getElementById('login').classList.remove('show');document.getElementById('sendLink').onclick=async()=>{let email=document.getElementById('email').value.trim();if(!email)return toast('กรุณากรอกอีเมล');let {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});if(error)return toast(error.message);toast('ส่งลิงก์เข้าสู่ระบบแล้ว กรุณาเช็กอีเมล');document.getElementById('login').classList.remove('show')};document.getElementById('addForm').onsubmit=async e=>{e.preventDefault();let name=document.getElementById('name').value.trim(),kind=document.getElementById('kind').value,{error}=await supabase.from('top10_items').insert({name,kind,image:document.getElementById('image').value.trim(),position:ranked(kind).length+1});if(error)return toast('เพิ่มไม่สำเร็จ');e.target.reset();await load()};if(supabase)supabase.auth.onAuthStateChange(async(_e,s)=>{let {data}=s?.user?await supabase.rpc('is_app_owner'):{data:false};isOwner=data===true;document.getElementById('status').textContent=isOwner?'เจ้าของเข้าสู่ระบบแล้ว':'Public list';document.getElementById('loginBtn').textContent=s?.user?'ออกจากระบบ':'เจ้าของรายการ';admin.classList.toggle('show',isOwner);render()});load();
</script></body></html>
